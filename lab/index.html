<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive Lab · 콘텐츠 개발 연구 워크스페이스</title>
<meta name="description" content="작품을 같은 기준으로 평가하고, 근거를 연재작 개선 가설과 신규 IP 기획으로 잇는 개인 콘텐츠 R&D 워크스페이스">
<meta property="og:type" content="website">
<meta property="og:title" content="Archive Lab · 콘텐츠 개발 연구 워크스페이스">
<meta property="og:description" content="평가 기준 → 개선 가설 → 신규 IP 기획. 관찰 사실·개인 해석·가설을 구분해 기록합니다.">
<meta property="og:url" content="https://reading-archive-ten.vercel.app/lab/">
<meta property="og:locale" content="ko_KR">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#FFFFFF; --surface:#F8F9FA; --line:#E5E7EB; --ink:#111827; --sub:#6B7280; --cap:#9CA3AF;
  --accent:#00DC64; --accent-ink:#04331A; --accent-soft:#E8FBF0; --danger:#B42318;
  --side:232px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.6 Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 12px 16px;display:flex;flex-direction:column;background:var(--bg)}
.brand{padding:0 10px 22px}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.4px}
.brand span{display:block;font-size:10.5px;color:var(--sub);letter-spacing:.6px;margin-top:2px}
.navlabel{font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--cap);padding:0 10px;margin:6px 0 6px}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--sub);padding:8px 10px;border-radius:6px;font-size:13.5px}
.nav a i{font-style:normal;font-size:11px;color:var(--cap);width:18px;font-variant-numeric:tabular-nums}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a.on{background:var(--surface);color:var(--ink);font-weight:700}
.nav a.on i{color:var(--ink)}
.nav .count{margin-left:auto;font-size:11px;color:var(--cap);font-variant-numeric:tabular-nums}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px 0;font-size:11.5px;color:var(--sub);line-height:1.55}
.sidefoot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cap);margin-right:6px;vertical-align:1px}
.sidefoot .dot.live{background:var(--accent)}
.sidefoot button{border:0;background:none;padding:0;color:var(--sub);text-decoration:underline;font-size:11.5px}

/* top */
main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px;gap:12px}
.crumb{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--surface);flex-shrink:0}
.seg button{border:0;background:none;padding:5px 12px;border-radius:5px;font-size:12.5px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.content{max-width:1120px;margin:0 auto;padding:40px 40px 96px}
.banner{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:0 0 24px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.banner button{border:0;background:none;padding:0;text-decoration:underline;color:var(--ink);font-size:12.5px}

/* type */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.1px;color:var(--sub);text-transform:uppercase}
h1.title{font-size:28px;line-height:1.3;letter-spacing:-1px;margin:8px 0 8px;font-weight:750}
.desc{color:var(--sub);margin:0;max-width:680px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.head .actions{margin-left:auto}
.sec{margin-top:44px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.sechead h2{font-size:16px;letter-spacing:-.4px;margin:0;font-weight:700}
.sechead p{margin:0;font-size:12px;color:var(--sub)}
.muted{color:var(--sub)} .cap{color:var(--cap)} .small{font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:6px;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{background:#00C95B}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none;padding-left:6px;padding-right:6px}
.btn.ghost:hover{background:var(--surface)}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
body:not(.editing) .e{display:none!important}
body.editing .v{display:none!important}

/* lines & tables */
.rule{border-top:1px solid var(--line)}
.tw{overflow-x:auto;border-top:1px solid var(--ink)}
table{width:100%;border-collapse:collapse;text-align:left}
th{font-size:11.5px;font-weight:600;color:var(--sub);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th.sort[aria-sort] {color:var(--ink)}
td{padding:12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
tr[data-href]{cursor:pointer}
tr[data-href]:hover td{background:var(--surface)}
td .t{font-weight:700}
td .s{font-size:11.5px;color:var(--sub)}
.lib td{min-width:90px}
.lib td.appeal{min-width:220px;color:#374151}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cap)}
.st.live::before{background:var(--accent)}
.st.done::before{background:var(--ink)}
.st.hold::before{background:#fff;box-shadow:inset 0 0 0 1.5px var(--cap)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.field{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 10px;font-size:13px;min-width:0}
.filters input.field{min-width:220px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:36px 20px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7}

/* overview */
.q3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.q3>div{padding:20px 22px 22px 0;display:flex;flex-direction:column}
.q3>div+div{padding-left:22px;border-left:1px solid var(--line)}
.q3 .n{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.8px}
.q3 h3{font-size:15px;margin:6px 0 10px;letter-spacing:-.3px;line-height:1.45}
.q3 ol,.q3 ul{margin:0 0 14px;padding-left:18px;color:#374151;font-size:12.5px;line-height:1.8}
.q3 a{margin-top:auto;font-size:12.5px;font-weight:600;text-decoration:none}
.q3 a:hover{text-decoration:underline}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px}
.list{border-top:1px solid var(--ink)}
.li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none}
.li:hover .lt{text-decoration:underline}
.li .lt{font-weight:650;font-size:13.5px}
.li .ls{font-size:12px;color:var(--sub);margin-top:2px}
.li .lr{font-size:12px;color:var(--sub);white-space:nowrap;text-align:right}
.todo{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.todo::before{content:"";width:12px;height:12px;border:1.5px solid var(--cap);border-radius:3px;margin-top:4px}
.todo small{display:block;color:var(--sub);font-size:11.5px}
.disclaim{font-size:12px;color:var(--sub);margin-top:14px}

/* report */
.split{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:48px;align-items:start}
.doc{border-top:1px solid var(--ink);padding-top:6px}
.doc h2{font-size:17px;letter-spacing:-.4px;margin:40px 0 4px;font-weight:700}
.doc h2:first-child{margin-top:22px}
.doc .lead2{font-size:12.5px;color:var(--sub);margin:0 0 14px}
.summary{font-size:18px;line-height:1.6;letter-spacing:-.4px;font-weight:600;margin:6px 0 10px}
.crit{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:20px 0;border-top:1px solid var(--line)}
.crit:last-child{border-bottom:1px solid var(--line)}
.crit .cn{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.6px}
.crit h3{font-size:14.5px;margin:4px 0 10px;letter-spacing:-.2px;line-height:1.4}
.score{display:flex;gap:3px;align-items:center}
.score i{width:16px;height:6px;border-radius:2px;background:var(--line)}
.score i.f{background:var(--ink)}
.score b{font-size:12px;margin-left:8px;font-variant-numeric:tabular-nums}
.score.none{font-size:12px;color:var(--sub)}
.kv3{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 14px;font-size:13px;line-height:1.65}
.kv3 dt{font-size:11.5px;color:var(--sub);padding-top:1px}
.kv3 dd{margin:0;white-space:pre-line}
.kv3 dd.q{color:var(--sub)}
.obs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.ob{padding:10px 0 10px 14px;border-left:2px solid var(--ink);margin:0 0 10px;font-size:13px;line-height:1.6}
.ob.interp{border-left:2px dashed var(--cap)}
.ob .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:4px}
.kindh{font-size:12px;font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between}
.vf{font-size:11px;color:var(--sub);white-space:nowrap}
.vf.verified{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin:8px 0 0}
.chartbox{border-top:1px solid var(--line);padding-top:8px;overflow-x:auto}
.legend span{min-width:0;max-width:100%;overflow-wrap:anywhere}
@media (max-width:860px){.legend{display:grid;gap:4px}}
@media (max-width:860px){.chartbox svg{min-width:720px}.chartbox::after{content:"← 옆으로 밀어 보기 →";display:block;font-size:11px;color:var(--cap);position:sticky;left:0}}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox svg text{font-family:Pretendard,sans-serif}
details.tbl{margin-top:10px}
details.tbl summary{cursor:pointer;font-size:12.5px;color:var(--sub);padding:6px 0}
details.tbl table td,details.tbl table th{padding:7px 10px;font-size:12px;white-space:nowrap}
details.tbl td.memo{white-space:normal;min-width:200px;color:var(--sub)}
.quotes{border-top:1px solid var(--line)}
.qt{display:grid;grid-template-columns:52px minmax(0,1fr) 70px;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.qt .ep{color:var(--sub);font-size:12px}
.qt .lk{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.qt .lk small{font-weight:400;color:var(--sub);font-size:11px}
.qt .bd{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.ledger{border-top:1px solid var(--line)}
.lg{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13px}
.lg small{display:block;font-size:11px;color:var(--sub)}
.lg svg{width:100%;height:18px;display:block}
.seg2 td,.seg2 th{font-size:12.5px}
ul.lim{margin:0;padding-left:18px;color:#374151;font-size:13px;line-height:1.85}
.aside{position:sticky;top:80px;font-size:12.5px}
.aside h3{font-size:12px;margin:0 0 8px;color:var(--sub);font-weight:700;letter-spacing:.4px}
.aside dl{margin:0 0 22px;display:grid;grid-template-columns:66px 1fr;gap:7px 10px}
.aside dt{color:var(--sub)}
.aside dd{margin:0;font-weight:600;word-break:keep-all}
.aside .box{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.aside .box p{margin:0 0 8px;color:var(--sub);line-height:1.6}
.aside a.lk{display:block;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600}
.aside a.lk:hover{text-decoration:underline}
.picker{min-width:220px}

/* hypothesis & idea docs */
.hdoc{border-top:1px solid var(--ink);padding:18px 0 26px;margin-bottom:26px}
.hdoc .hh{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.hdoc h3{font-size:17px;letter-spacing:-.4px;margin:4px 0 2px;line-height:1.4}
.hdoc .hm{font-size:12px;color:var(--sub)}
.steps{margin-top:16px;display:grid;gap:0}
.stp{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;padding:13px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.7}
.stp .sl{font-size:12px;font-weight:700}
.stp .sl small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.stp .sb{white-space:pre-line}
.stp.hyp .sb{padding-left:12px;border-left:2px solid var(--accent)}
.stp.interp .sb{padding-left:12px;border-left:2px dashed var(--cap)}
.stp.fact .sb{padding-left:12px;border-left:2px solid var(--ink)}
.notice{font-size:12px;color:var(--sub);border-left:2px solid var(--line);padding:4px 0 4px 12px;margin:0 0 24px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--sub)}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.pr{border-top:1px solid var(--line)}
.pr .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.pr .row small{display:block;color:var(--sub);font-size:11.5px}

/* compare */
.cmp td,.cmp th{min-width:200px}
.cmp th:first-child,.cmp td:first-child{min-width:140px;color:var(--sub);font-size:12px;font-weight:600;position:sticky;left:0;background:#fff}
.cmp td .j{font-size:12px;color:#374151;margin-top:6px;white-space:pre-line}
.cmpsum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:8px}
.cmpsum ul{margin:0;padding-left:18px;font-size:13px;line-height:1.85}

/* data page */
.store{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.store ul{margin:0;padding-left:18px;font-size:13px;line-height:1.85;color:#374151}
.kvline{display:flex;gap:28px;flex-wrap:wrap;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:14px 0}
.kvline div{min-width:110px}
.kvline b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.kvline span{font-size:11.5px;color:var(--sub)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.28);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column}
.drawer:not(.on){visibility:hidden;transition:transform .18s ease,visibility 0s .18s}
.drawer.on{transform:none}
html,body{overflow-x:clip}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:16px;margin:0;letter-spacing:-.3px}
.drawer header p{margin:4px 0 0;font-size:12px;color:var(--sub)}
.drawer .body{flex:1;overflow:auto;padding:18px 24px 24px}
.drawer footer{border-top:1px solid var(--line);padding:12px 24px;display:flex;gap:6px;align-items:center}
.drawer footer .sp{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fl{display:grid;gap:5px;margin-bottom:14px;font-size:12px;font-weight:700;grid-column:1/-1}
.fl.half{grid-column:auto}
.fl .h{font-weight:400;color:var(--sub);font-size:11.5px}
.fl input,.fl textarea,.fl select{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;font-weight:400;background:#fff}
.fl textarea{min-height:76px;resize:vertical;line-height:1.6}
.fl textarea.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;min-height:220px;white-space:pre;overflow-x:auto}
.fh{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.3px;padding:14px 0 8px;margin-top:4px;border-top:1px solid var(--line);color:var(--ink)}
.fh:first-child{border-top:0;padding-top:0}
.fh small{display:block;font-weight:400;color:var(--sub);font-size:11.5px;letter-spacing:0;margin-top:2px}
.obsrow{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;display:grid;gap:8px}
.obsrow .sel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px}
.obsrow select,.obsrow textarea,.obsrow input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;width:100%;background:#fff}
.obsrow textarea{min-height:54px;resize:vertical}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:30}
.toast.on{opacity:1}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;opacity:0;z-index:31;white-space:nowrap}

/* responsive */
.doc,.aside{min-width:0}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}.aside{position:static;border-top:1px solid var(--line);padding-top:18px}.cols{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{display:block}
  .side{position:sticky;top:0;z-index:6;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px 8px}
  .brand{padding:0 0 6px}.brand span,.navlabel,.sidefoot{display:none}
  .nav{display:flex;overflow-x:auto;gap:2px;scrollbar-width:none}
  .nav a{white-space:nowrap;padding:7px 9px;font-size:12.5px}.nav a i,.nav .count{display:none}
  .top{position:static;padding:0 16px;height:48px}
  .content{padding:26px 16px 72px}
  h1.title{font-size:23px}
  .q3{grid-template-columns:1fr}.q3>div,.q3>div+div{padding:16px 0;border-left:0}.q3>div+div{border-top:1px solid var(--line)}
  .crit{grid-template-columns:1fr;gap:10px}
  .obs,.cmpsum,.store{grid-template-columns:1fr}
  .stp{grid-template-columns:1fr;gap:4px}
  .lg{grid-template-columns:1fr;gap:4px}
  .filters input.field{min-width:0;flex:1 1 100%}
  .fgrid{grid-template-columns:1fr}.fl.half{grid-column:1/-1}
  .obsrow .sel{grid-template-columns:1fr 1fr}
  .qt{grid-template-columns:44px minmax(0,1fr) 54px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">

/* ── 03 평가 리포트 ── */
function epChart(w){
  const E=(w.episodes||[]).filter(e=>Number.isFinite(e.ep)).sort((a,b)=>a.ep-b.ep);
  if(!E.length)return '<div class="empty">회차 데이터가 없어요.<span class="e"><br>편집 모드에서 표를 붙여 넣으면 같은 회차 축으로 그려집니다.</span></div>';
  const n=Math.max(...E.map(e=>e.ep)),L=168,R=12,W=960,cw=(W-L-R)/n,cx=ep=>L+cw*(ep-.5);
  const rows=METRICS.filter(m=>E.some(e=>e[m.k]!=null&&e[m.k]!==''));
  const H={line:120,bar:64,heat:28,cell:26};
  let y=10,out='';
  const meta=k=>{const m=w.metricMeta?.[k]||{};return [m.src,m.v&&VERIFY[m.v]?VERIFY[m.v][0]+' '+VERIFY[m.v][1]:''].filter(Boolean).join(' · ')};
  rows.forEach(m=>{
    const h=H[m.type],vals=E.filter(e=>e[m.k]!=null&&e[m.k]!=='');
    out+=`<text x="0" y="${y+14}" font-size="13" font-weight="700" fill="#111827">${esc(m.n)}</text><text x="0" y="${y+31}" font-size="11" fill="#6B7280">${esc(meta(m.k))}</text>`;
    if(m.type==='line'){
      const nums=vals.map(e=>+e[m.k]),lo=Math.floor(Math.min(...nums)*2)/2,hi=Math.ceil(Math.max(...nums)*2)/2||lo+1,Y=v=>y+6+(hi-v)/((hi-lo)||1)*(h-12);
      const ticks=[];for(let g=Math.ceil(lo);g<=hi;g++)ticks.push(g);if(ticks.length<2)ticks.splice(0,ticks.length,lo,hi);
      ticks.forEach(g=>{out+=`<line x1="${L}" x2="${W-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="#EEF0F2"/><text x="${L-8}" y="${Y(g)+4}" font-size="10.5" fill="#9CA3AF" text-anchor="end">${g.toFixed(1)}</text>`});
      out+=`<polyline points="${vals.map(e=>cx(e.ep)+','+Y(+e[m.k])).join(' ')}" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>`;
      vals.forEach(e=>{out+=`<circle cx="${cx(e.ep)}" cy="${Y(+e[m.k])}" r="4" fill="#111827" stroke="#fff" stroke-width="2"/><circle cx="${cx(e.ep)}" cy="${Y(+e[m.k])}" r="12" fill="transparent" data-tip="${e.ep}화 ${esc(m.n)} ${(+e[m.k]).toFixed(2)}"/>`});
    }else if(m.type==='bar'){
      const mx=Math.max(...vals.map(e=>+e[m.k]))||1,base=y+h;
      out+=`<line x1="${L}" x2="${W-R}" y1="${base}" y2="${base}" stroke="#E5E7EB"/>`;
      vals.forEach(e=>{const v=+e[m.k],bh=Math.max(2,v/mx*(h-14)),bw=Math.min(22,cw*.55),x=cx(e.ep)-bw/2,top=base-bh,r=Math.min(3,bh/2);
        out+=`<path d="M${x},${base}V${top+r}Q${x},${top} ${x+r},${top}H${x+bw-r}Q${x+bw},${top} ${x+bw},${top+r}V${base}Z" fill="#C4C9D0"/><rect x="${cx(e.ep)-cw/2}" y="${y}" width="${cw}" height="${h}" fill="transparent" data-tip="${e.ep}화 ${esc(m.n)} ${v}"/>`;
        if(v===mx)out+=`<text x="${cx(e.ep)}" y="${top-5}" font-size="11" font-weight="700" fill="#111827" text-anchor="middle">${v}</text>`});
    }else if(m.type==='heat'){
      const shade=['#F3F4F6','#E5E7EB','#D1D5DB','#9CA3AF','#374151'];
      vals.forEach(e=>{const v=Math.max(1,Math.min(5,Math.round(+e[m.k])));out+=`<rect x="${cx(e.ep)-cw/2+2}" y="${y+4}" width="${cw-4}" height="${h-6}" rx="4" fill="${shade[v-1]}" data-tip="${e.ep}화 몰입 ${v}"/><text x="${cx(e.ep)}" y="${y+h/2+5}" font-size="11" font-weight="600" fill="${v>=5?'#fff':'#374151'}" text-anchor="middle" pointer-events="none">${v}</text>`});

/* ── 서랍(편집 패널) ── */
let drawerSave=null;
function openDrawer(title,desc,body,onSave,extra){
  const d=$('drawer');
  d.innerHTML=`<header><div><h2>${esc(title)}</h2>${desc?`<p>${esc(desc)}</p>`:''}</div><button class="btn ghost" type="button" data-act="closeDrawer" aria-label="닫기">닫기</button></header>
    <form class="body" id="dform" novalidate>${body}</form>
    <footer>${extra||''}<span class="sp"></span><button class="btn" type="button" data-act="closeDrawer">취소</button><button class="btn primary" type="submit" form="dform">저장</button></footer>`;
  drawerSave=onSave;d.classList.add('on');d.setAttribute('aria-hidden','false');$('scrim').classList.add('on');
  $('dform').onsubmit=e=>{e.preventDefault();const f=e.target;const req=[...f.querySelectorAll('[required]')].find(x=>!x.value.trim());if(req){req.focus();toast('필수 항목을 채워 주세요');return}
    if(drawerSave&&drawerSave(f)!==false)closeDrawer()};
  setTimeout(()=>d.querySelector('input,textarea,select')?.focus(),60)}
function closeDrawer(){$('drawer').classList.remove('on');$('drawer').setAttribute('aria-hidden','true');$('scrim').classList.remove('on');drawerSave=null}
$('scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('drawer').classList.contains('on'))closeDrawer();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-href]')){e.preventDefault();location.hash=e.target.dataset.href}});
function fld(f,val){
  if(f.type==='h')return `<div class="fh">${esc(f.l)}${f.s?`<small>${esc(f.s)}</small>`:''}</div>`;
  const v=val??f.def??'',id='f_'+f.k;
  let inp;
  if(f.type==='textarea'||f.type==='mono')inp=`<textarea id="${id}" name="${f.k}" ${f.req?'required':''} class="${f.type==='mono'?'mono':''}" ${f.ph?`placeholder="${esc(f.ph)}"`:''} spellcheck="${f.type==='mono'?'false':'true'}">${esc(v)}</textarea>`;
  else if(f.type==='select')inp=`<select id="${id}" name="${f.k}">${f.opts.map(o=>{const[ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else inp=`<input id="${id}" name="${f.k}" type="${f.type||'text'}" value="${esc(v)}" ${f.req?'required':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''} maxlength="300">`;
  return `<label class="fl ${f.half?'half':''}" for="${id}">${esc(f.l)}${f.req?' *':''}${inp}${f.h?`<span class="h">${esc(f.h)}</span>`:''}</label>`}
const form=(F,data)=>`<div class="fgrid">${F.map(f=>fld(f,data?.[f.k])).join('')}</div>`;
const val=(f,k)=>(f.elements[k]?.value??'').trim();

/* 회차·댓글·질문 데이터 (표 붙여넣기) */
const EP_H=['회차','별점','좋아요','댓글 수','몰입','다음 화 볼 이유','메모'],Q_H=['요지','회차','공감','배지'],L_H=['질문','열린 회차','답이 나온 회차','핵심'];
const toTSV=(H,rows)=>[H.join('\t'),...rows.map(r=>r.map(x=>x??'').join('\t'))].join('\n');
const parseTSV=s=>String(s||'').split(/\r?\n/).filter(l=>l.trim()).map(l=>l.includes('\t')?l.split('\t'):l.split(/\s*,\s*/)).slice(1);
const n_=v=>{const x=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return Number.isFinite(x)?x:null};
function editData(id){
  const w=work(id),mm=w.metricMeta;
  const vOpts=Object.entries(VERIFY).map(([k,[d,l]])=>[k,d+' '+l]);
  const F=[{type:'h',l:'회차 기록',s:'스프레드시트에서 복사해 붙여 넣으면 됩니다 · 첫 줄은 제목 · 탭 또는 쉼표로 구분 · 빈칸은 비워 두기'},
    {k:'ep',l:'회차 표',type:'mono'},
    ...METRICS.flatMap(m=>[{k:'src_'+m.k,l:m.n+' · 출처',type:'select',opts:SOURCES,half:true},{k:'v_'+m.k,l:m.n+' · 검증',type:'select',opts:vOpts,half:true},{k:'note_'+m.k,l:m.n+' · 메모',ph:'수집 범위나 주의할 점'}]),
    {type:'h',l:'인기 댓글',s:'닉네임은 적지 않습니다 · 원문 요지만'},{k:'qt',l:'댓글 표',type:'mono'},{k:'qv',l:'댓글 검증',type:'select',opts:vOpts,half:true},{k:'qnote',l:'댓글 메모',half:true},
    {type:'h',l:'질문 장부 (리딩 로그)',s:'답이 아직 없으면 비워 두기 · 핵심 질문은 O'},{k:'lq',l:'질문 표',type:'mono'}];
  const data={ep:toTSV(EP_H,w.episodes.map(e=>[e.ep,e.rating,e.likes,e.comments,e.immerse,e.reason,e.memo])),
    qt:toTSV(Q_H,w.quotes.map(q=>[q.text,q.ep,q.likes,q.badge])),qv:w.quotesMeta?.v||'verified',qnote:w.quotesMeta?.note||'',
    lq:toTSV(L_H,w.questions.map(q=>[q.q,q.open,q.close,q.key?'O':'']))};
  METRICS.forEach(m=>{const x=mm[m.k]||{};data['src_'+m.k]=x.src||(m.k==='immerse'||m.k==='reason'?'리딩 로그':'공개 지표');data['v_'+m.k]=x.v||(m.k==='immerse'||m.k==='reason'?'personal':'unverified');data['note_'+m.k]=x.note||''});
  openDrawer('회차·댓글 데이터',w.title,form(F,data),f=>{
    w.episodes=parseTSV(val(f,'ep')).map(r=>({ep:n_(r[0]),rating:n_(r[1]),likes:n_(r[2]),comments:n_(r[3]),immerse:n_(r[4]),reason:(r[5]||'').trim()||null,memo:(r[6]||'').trim()})).filter(e=>e.ep!=null);
    METRICS.forEach(m=>{mm[m.k]={src:val(f,'src_'+m.k),v:val(f,'v_'+m.k),note:val(f,'note_'+m.k)}});
    w.quotes=parseTSV(val(f,'qt')).map(r=>({text:(r[0]||'').trim(),ep:n_(r[1]),likes:n_(r[2]),badge:(r[3]||'').trim()})).filter(q=>q.text);
    w.quotesMeta={src:'댓글',v:val(f,'qv'),note:val(f,'qnote')};
    w.questions=parseTSV(val(f,'lq')).map(r=>({q:(r[0]||'').trim(),open:n_(r[1]),close:n_(r[2]),key:/^(o|y|1|핵심)/i.test((r[3]||'').trim())})).filter(q=>q.q&&q.open!=null);
    save('데이터를 저장했어요')})}

/* 가설 */
const HYP_F=()=>[{k:'work',l:'연결 작품',type:'select',opts:DB.works.map(w=>[w.id,w.title]),half:true},{k:'status',l:'상태',type:'select',opts:HSTATUS,half:true},
  {k:'title',l:'가설 제목',req:true},
  {k:'observation',l:'01 관찰 사실',type:'textarea',req:true,h:'확인한 사실과 출처 · 검증 상태를 괄호로'},{k:'interpretation',l:'02 해석',type:'textarea',h:'사실에서 읽은 것 (개인 해석)'},
  {k:'hypothesis',l:'03 개선 가설',type:'textarea',req:true,h:'무엇을 바꾸면 무엇이 달라질 거라고 보나요?'},{k:'question',l:'04 작가 협의 질문',type:'textarea',h:'창작 의도와 제약을 먼저 묻는 질문'},
  {k:'validation',l:'05 검증 방법',type:'textarea',h:'어떤 지표·반응으로 확인할까요?'},{k:'note',l:'메모',ph:'예: 개인 기획 제안 · 아직 적용 전'}];
function editHyp(id){
  if(!DB.works.length){toast('작품을 먼저 등록해 주세요');return}
  const h=id?DB.hypotheses.find(x=>x.id===id):null;
  openDrawer(h?'가설 수정':'가설 작성','관찰 → 해석 → 가설 → 질문 → 검증',form(HYP_F(),h||{work:HF.work||DB.works[0].id,status:'초안',note:'개인 기획 제안 · 아직 적용 전'}),f=>{
    const o={};HYP_F().forEach(x=>o[x.k]=val(f,x.k));
    if(h){Object.assign(h,o);save('가설을 저장했어요')}else{DB.hypotheses.push({id:uid('h'),created:todayISO(),...o});save('가설을 추가했어요')}},
    h?`<button class="btn danger" type="button" data-act="deleteHyp" data-id="${esc(h.id)}">삭제</button>`:'')}

/* IP 기획 */
const IDEA_F=()=>[{k:'title',l:'프로젝트 가제',req:true,half:true},{k:'status',l:'상태',type:'select',opts:ISTATUS,half:true},
  {k:'genre',l:'핵심 소재 · 장르'},{k:'target',l:'타깃 독자',h:'누구에게 어떤 재미를 줄까요?'},{k:'logline',l:'한 줄 로그라인',type:'textarea',req:true,h:'주인공 · 갈등 · 목표가 드러나게'},
  {k:'characters',l:'캐릭터와 관계성',type:'textarea'},{k:'hook3',l:'초반 3화 후킹 아이디어',type:'textarea',h:'1~3화에서 독자가 품을 질문'},
  {k:'difference',l:'차별화 포인트',type:'textarea',h:'비슷한 장르와 무엇이 다른가요?'},
  {k:'ref',l:'참고한 작품',type:'select',opts:[['','독립 기획'],...DB.works.map(w=>[w.id,w.title])]},
  {k:'refNote',l:'관찰 근거 · 가져온 원리',type:'textarea',h:'어떤 재미의 원리를 가져왔는지 적고, 설정·인물·장면은 가져오지 않습니다'},
  {k:'test',l:'검증이 필요한 가설',type:'textarea'}];
function editIdea(id,pre){
  const x=id?DB.ideas.find(i=>i.id===id):null;
  openDrawer(x?'기획안 수정':'기획안 작성','관찰한 재미의 원리를 새 콘셉트로',form(IDEA_F(),x||{status:'아이디어',...(pre||{})}),f=>{
    const o={};IDEA_F().forEach(k=>o[k.k]=val(f,k.k));
    if(x){Object.assign(x,o);save('기획안을 저장했어요')}else{DB.ideas.push({id:uid('i'),created:todayISO(),...o});save('기획안을 추가했어요')}},
    x?`<button class="btn danger" type="button" data-act="deleteIdea" data-id="${esc(x.id)}">삭제</button>`:'')}

/* 백업·복원 */
function exportJSON(){const blob=new Blob([JSON.stringify({app:'archive-lab',version:VERSION,exported:new Date().toISOString(),data:DB},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='archive-lab-backup-'+todayISO()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function importJSON(file){
  try{const j=JSON.parse(await file.text()),d=j.data||j;
    if(!Array.isArray(d.works)||!Array.isArray(d.hypotheses)||!Array.isArray(d.ideas))throw Error('Archive Lab 백업 형식이 아니에요');
    if(!confirm(`작품 ${d.works.length} · 가설 ${d.hypotheses.length} · 기획안 ${d.ideas.length}건으로 지금 내용을 바꿀까요?`))return;
    DB=normalize(d);save('백업을 불러왔어요')}catch(e){alert('불러오지 못했어요: '+e.message)}}

/* ── 동작 연결 ── */
const ACT={
  newWork:()=>editWork(),editWork,editEval,editObs,editData,
  deleteWork:id=>{const w=work(id),nh=DB.hypotheses.filter(h=>h.work===id).length;if(!confirm(`『${w.title}』을 삭제할까요?\n연결된 개선 가설 ${nh}건도 함께 삭제됩니다. 되돌리려면 JSON 백업이 필요해요.`))return;
    DB.works=DB.works.filter(x=>x.id!==id);DB.hypotheses=DB.hypotheses.filter(h=>h.work!==id);DB.ideas.forEach(i=>{if(i.ref===id)i.ref=''});location.hash='#/library';save('작품을 삭제했어요')},
  newHyp:()=>editHyp(),editHyp,deleteHyp:id=>{if(!confirm('이 가설을 삭제할까요?'))return;DB.hypotheses=DB.hypotheses.filter(h=>h.id!==id);closeDrawer();save('가설을 삭제했어요')},
  filterH:id=>{HF.work=id},
  newIdea:()=>editIdea(),editIdea:id=>editIdea(id),
  ideaFrom:(id,b)=>{const w=work(id),p=w.principles[+b.dataset.i];editIdea(null,{ref:id,refNote:`가져온 원리: ${p}\n(『${w.title}』 관찰에서 뽑은 개인 해석 · 설정·인물은 가져오지 않음)`})},
  deleteIdea:id=>{if(!confirm('이 기획안을 삭제할까요?'))return;DB.ideas=DB.ideas.filter(i=>i.id!==id);closeDrawer();save('기획안을 삭제했어요')},
  cmpToggle:id=>{CMP=CMP.includes(id)?CMP.filter(x=>x!==id):[...CMP,id].slice(-6);render()},
  closeDrawer,addRow:()=>{$('obsList').insertAdjacentHTML('beforeend',obsRow({kind:'fact',src:'댓글',v:'verified'}));$('obsList').lastElementChild.querySelector('textarea').focus()},
  rmRow:(id,b)=>b.closest('.obsrow').remove(),
  exportJSON,
  resetLocal:()=>{if(!confirm('이 브라우저에서 고친 내용을 지우고 게시본으로 돌아갈까요? 먼저 JSON 백업을 권해요.'))return;store(LSKEY,null);DB=normalize(PUBLISHED?JSON.parse(JSON.stringify(PUBLISHED)):seed());SRC=PUBLISHED?'published':'seed';render();toast('게시본으로 되돌렸어요')},
  resetSeed:()=>{if(!confirm('기본 사례(『유체를 이탈하였습니다』 분석)만 남기고 초기화할까요? 지금 내용은 사라져요. 먼저 JSON 백업을 권해요.'))return;DB=normalize(seed());save('기본 사례로 초기화했어요')},
  publishNow:()=>{publish();toast('서버에 게시하는 중…')},
  lock:()=>{ADMIN='';store('lab-admin',null);location.reload()},
  visits:async()=>{let rows=[];try{const r=await fetch('/api/visit',{headers:{'x-admin-key':ADMIN},cache:'no-store'});rows=(await r.json()).visits||[]}catch(e){}
    $('visitBox').innerHTML=`<div class="sechead sec"><h2>방문 기록 ${rows.length}건</h2><p>시간 · 지역(도시 단위) · 기기 · 처음 연 화면 · 들어온 곳만</p></div><div class="tw"><table><thead><tr><th>시간</th><th>지역</th><th>기기</th><th>화면</th><th>들어온 곳</th></tr></thead><tbody>${rows.map(v=>`<tr><td>${new Date(v.t).toLocaleString('ko-KR')}</td><td>${esc(v.country||'')}${v.city?' · '+esc(decodeURIComponent(v.city)):''}</td><td>${esc(v.device||'')}</td><td>${esc(v.path||'')}</td><td>${esc(v.ref||'직접 접속')}</td></tr>`).join('')||'<tr><td colspan="5">기록 없음</td></tr>'}</tbody></table></div>`}
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(a){const fn=ACT[a.dataset.act];if(fn){if(a.tagName!=='A')e.preventDefault();fn(a.dataset.id,a)}return}
  const r=e.target.closest('tr[data-href]');if(r)location.hash=r.dataset.href});
document.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files[0]){importJSON(e.target.files[0]);e.target.value=''}if(e.target.id==='pick')location.hash='#/report/'+e.target.value});
// 차트 툴팁
const tip=$('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.textContent=t.getAttribute('data-tip');tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=e.clientY+14+'px';tip.style.opacity=1});

/* ── 라우팅 ── */
function render(){
  const [,r,id]=(location.hash||'#/overview').split('/');
  const route={overview:1,library:1,report:1,hypotheses:1,ideas:1,compare:1,data:1}[r]?r:'overview';
  nav(route);foot();
  const v=$('view');
  v.innerHTML={overview:viewOverview,library:viewLibrary,report:()=>viewReport(id?decodeURIComponent(id):''),hypotheses:viewHyp,ideas:viewIdeas,compare:viewCompare,data:viewData}[route]();
  if(route==='library')bindLibrary();if(route==='hypotheses')bindHyp();
  document.title=({overview:'개요',library:'작품 라이브러리',report:'평가 리포트',hypotheses:'개선 가설',ideas:'신규 IP 기획',compare:'작품 비교',data:'데이터 관리'}[route])+' · Archive Lab'}
let lastRoute='';
window.addEventListener('hashchange',()=>{closeDrawer();const r=(location.hash.split('/')[1]||'')+(location.hash.split('/')[2]||'');render();if(r!==lastRoute)window.scrollTo(0,0);lastRoute=r});

/* ── 편집 키 · 방문 기록 ── */
async function unlock(){const k=prompt('편집 키를 입력해 주세요');if(!k)return;
  try{const r=await fetch('/api/notes',{method:'POST',headers:{'content-type':'application/json','x-admin-key':k},body:JSON.stringify({check:true})});
    if(r.ok){ADMIN=k;store('lab-admin',k)}else alert('편집 키가 맞지 않아요')}catch(e){alert('저장소에 연결하지 못했어요')}}
function logVisit(){try{if(ADMIN)return;fetch('/api/visit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path:'/lab/'+(location.hash||'#'),ref:document.referrer||''}),keepalive:true}).catch(()=>{})}catch(e){}}

(async function boot(){
  if(new URLSearchParams(location.search).has('edit')&&!ADMIN){history.replaceState(null,'',location.pathname+location.hash);await unlock()}
  try{const r=await fetch('/api/notes',{cache:'no-store'});if(r.ok){const j=await r.json();API_OK=true;const s=j.notes?.[WSKEY];if(s){try{PUBLISHED=JSON.parse(s)}catch(e){}}}}catch(e){}
  let local=null;try{local=JSON.parse(store(LSKEY)||'null')}catch(e){}
  if(ADMIN&&API_OK){DB=PUBLISHED?JSON.parse(JSON.stringify(PUBLISHED)):(local?.data||seed());SRC='server'}
  else if(local?.edited&&local.data){DB=local.data;SRC='local'}
  else{DB=PUBLISHED?JSON.parse(JSON.stringify(PUBLISHED)):seed();SRC=PUBLISHED?'published':'seed'}
  normalize(DB);
  if(!location.hash||!location.hash.startsWith('#/'))history.replaceState(null,'',location.pathname+location.search+'#/overview');
  setMode(ADMIN?true:store('lab-mode')==='edit',true);
  render();lastRoute=(location.hash.split('/')[1]||'')+(location.hash.split('/')[2]||'');logVisit()})();
</script>
