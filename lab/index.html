<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Archive Lab</title>
<meta name="description" content="회차마다 같은 기준으로 감상 · 독자 반응 · 작가 의도를 기록하고, 초기 판단을 나중에 검증하는 개인 웹툰 리딩 로그">
<meta property="og:type" content="website">
<meta property="og:title" content="Data Archive Lab · 검토 중인 작품">
<meta property="og:description" content="회차별 리딩 로그와 초기 판단 검증을 위한 개인 웹툰 검토 도구">
<meta property="og:url" content="https://reading-archive-ten.vercel.app/lab/">
<meta property="og:locale" content="ko_KR">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#F3F5F8;--card:#FFFFFF;--ink:#141820;--sub:#5B6472;--cap:#98A1AE;--line:#E6E9EE;--blue:#00A04D;--blue-soft:#E7F7EE;--grey-soft:#EEF0F3;--danger:#B42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:32px 32px 72px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px;flex-wrap:wrap}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--blue)}
h1{font-size:30px;margin:6px 0 6px;letter-spacing:-.02em}
.lead{margin:0;color:var(--sub);font-size:15px}
.btn{border:0;background:var(--card);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.btn:hover{background:#F8F9FB}
.btn.primary{background:var(--blue);color:#fff;box-shadow:none}
.btn.primary:hover{background:#008C43}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--danger)}
.card{background:var(--card);border-radius:18px;padding:26px 28px}
.pill{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--grey-soft);color:var(--sub);white-space:nowrap}
.pill.b{background:var(--blue-soft);color:var(--blue)}
.pill.ok{background:#E7F7EE;color:#137A43}
.muted{color:var(--sub)}.cap{color:var(--cap)}

/* home */
.filters{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:#E4E8EE;border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,24,32,.12)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.work{cursor:pointer;display:flex;flex-direction:column;padding:0;overflow:hidden;transition:transform .12s,box-shadow .12s;text-align:left;border:0}
.work:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(20,24,32,.08)}
.cover{aspect-ratio:16/9;background:linear-gradient(135deg,#E9EDF3,#DDE3EC);display:flex;align-items:center;justify-content:center;color:#8A94A3;font-size:13px;font-weight:600;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .ph{display:flex;flex-direction:column;align-items:center;gap:4px}
.cover .ph b{font-size:28px;color:#B4BCC8}
.wb{padding:18px 22px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.wb h2{font-size:21px;margin:2px 0 0;letter-spacing:-.02em}
.wb .by{font-size:13.5px;color:var(--sub);margin:0}
.wb .tags{display:flex;gap:6px;flex-wrap:wrap}
.wb .tags span{font-size:12px;color:var(--sub);background:var(--grey-soft);border-radius:999px;padding:2px 9px}
.wb .meta{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--cap)}
.wb .meta b{display:block;font-size:16px;color:var(--ink)}
.addcard{cursor:pointer;border:2px dashed #D5DAE1;background:transparent;border-radius:18px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--sub);font-size:14px}
.addcard b{font-size:30px;color:var(--cap);font-weight:400}
.addcard:hover{border-color:var(--blue);color:var(--blue)}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:30px;font-size:14px}

/* work page */
.back{border:0;background:none;color:var(--blue);font-weight:600;font-size:14px;padding:0;margin-bottom:12px}
.whead{display:grid;grid-template-columns:240px minmax(0,1fr) auto;gap:24px;align-items:start;margin-bottom:22px}
.whead .cover{border-radius:14px;overflow:hidden}
.whead h1{margin:6px 0 4px}
.whead .intro{font-size:14.5px;color:var(--sub);line-height:1.65;margin:10px 0 0;max-width:720px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tabs{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:9px 14px;border-radius:10px;font-size:15px;font-weight:600;color:var(--sub)}
.tabs button.on{background:var(--ink);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.stack{display:grid;gap:20px}
.ctitle{font-size:19px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cmeta{font-size:13px;color:var(--cap);margin:0 0 16px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 16px;font-size:14.5px;line-height:1.6;margin:0}
.kv dt{color:var(--cap)}.kv dd{margin:0;white-space:pre-line}
.blank{color:var(--cap);font-style:normal}
.status{display:flex;gap:16px;flex-wrap:wrap}
.status div{min-width:90px}
.status b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.status span{font-size:12.5px;color:var(--cap)}

/* episode log */
.eplist{display:grid;gap:12px}
.ep{background:var(--card);border-radius:16px;padding:0;overflow:hidden}
.ep summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:64px 120px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 22px}
.ep summary::-webkit-details-marker{display:none}
.ep .no{font-weight:800;font-size:16px}
.stars{color:#F2B705;letter-spacing:1px;font-size:14px;white-space:nowrap}
.stars .off{color:#D9DEE5}
.ep .line{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep[open] summary{border-bottom:1px solid var(--line)}
.epb{padding:18px 22px 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.fbox{background:#F8F9FB;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;white-space:pre-line}
.fbox b{display:block;font-size:12px;color:var(--blue);margin-bottom:4px;letter-spacing:.02em}
.fbox.pub b{color:var(--sub)}
.fbox.intent{grid-column:1/-1;background:#FBFAF4}
.fbox.intent b{color:#8A6D00}
.epact{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.addep{background:transparent;border:2px dashed #D5DAE1;border-radius:16px;padding:16px;color:var(--sub);font-size:14px;font-weight:600}
.addep:hover{border-color:var(--blue);color:var(--blue)}

/* chart */
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:680px}
.chart svg text{font-family:Pretendard,sans-serif}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-top:8px}
ul.list{margin:0;padding-left:18px;font-size:14.5px;line-height:1.75}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.qrow:last-child{border-bottom:0}

.crit{display:grid;gap:0}
.crow{border-top:1px solid var(--line);padding:16px 0;display:grid;grid-template-columns:190px repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.crow:first-child{border-top:0;padding-top:4px}
.crow h4{margin:0;font-size:15px;line-height:1.45;letter-spacing:-.01em}
.crow h4 .cn{display:block;font-size:12px;color:var(--blue);margin-bottom:4px}
.cb{border-radius:10px;padding:11px 13px;font-size:14px;line-height:1.6}
.cb b{display:block;font-size:12px;margin-bottom:4px;letter-spacing:.01em}
.cb.fact{background:#F6F7F9}.cb.fact b{color:var(--sub)}
.cb.interp{border:1.5px dashed #C9D0DA}.cb.interp b{color:var(--sub)}
.cb.judge{background:var(--ink);color:#fff}.cb.judge b{color:#7BE3A8}
.cb.ask{background:var(--blue-soft)}.cb.ask b{color:var(--blue)}
@media (max-width:900px){.crow{grid-template-columns:1fr}}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,24,32,.3);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:#fff;z-index:21;transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(20,24,32,.08)}
.drawer:not(.on){visibility:hidden;transition:transform .18s ease,visibility 0s .18s}
.drawer.on{transform:none}
.drawer header{display:flex;justify-content:space-between;gap:12px;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:18px;margin:0}.drawer header p{margin:3px 0 0;font-size:13px;color:var(--sub)}
.drawer .body{flex:1;overflow:auto;padding:18px 24px}
.drawer footer{border-top:1px solid var(--line);padding:12px 24px;display:flex;gap:8px;align-items:center}
.drawer footer .sp{flex:1}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.f{display:grid;gap:6px;margin-bottom:14px;font-size:13px;font-weight:700;grid-column:1/-1}
.f.half{grid-column:auto}
.f .h{font-weight:400;color:var(--cap);font-size:12px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:400;background:#fff;line-height:1.55}
.f textarea{min-height:76px;resize:vertical}
.sect{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--blue);padding:10px 0 8px;border-top:1px solid var(--line);margin-top:4px;letter-spacing:.02em}
.sect:first-child{border-top:0;margin-top:0;padding-top:0}
.drop{border:2px dashed #D5DAE1;border-radius:12px;padding:18px;text-align:center;color:var(--sub);font-size:13px;font-weight:400;background:#FAFBFC}
.drop b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.drop small{color:var(--cap)}
.starpick{display:flex;gap:4px}
.starpick button{border:0;background:none;font-size:26px;line-height:1;color:#D9DEE5;padding:0 2px}
.starpick button.on{color:#F2B705}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:30}
.toast.on{opacity:1}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:8px;opacity:0;z-index:31;white-space:nowrap}
.foot{margin-top:40px;font-size:12.5px;color:var(--cap);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (max-width:900px){
  .wrap{padding:22px 16px 56px}
  .whead{grid-template-columns:1fr}.whead .cover{max-width:360px}
  .grid2{grid-template-columns:1fr}
  .epb{grid-template-columns:1fr}
  .ep summary{grid-template-columns:52px minmax(0,1fr) auto;padding:14px 16px}.ep .line{grid-column:1/-1}
  .fg{grid-template-columns:1fr}.f.half{grid-column:1/-1}
  .card{padding:20px 18px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true"></aside>
<div class="toast" id="toast" role="status"></div>
<div class="tip" id="tip"></div>
<script defer src="/_vercel/insights/script.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   Data Archive Lab v8 (프로토타입)
   - 작품 서재(카드) → 작품 페이지(개요 · 회차 로그 · 데이터 차팅 · 검토 노트)
   - 구분: 연재작 분석 / 투고 · 원석 검토
   - 저장: /api/notes 'ws:v1' 안의 lab 필드(편집 키 있을 때) · 없으면 이 브라우저
     (v5~v7의 works · hypotheses · findings 등 기존 필드는 지우지 않고 보존)
   - 이미지 업로드 칸은 화면만 있고 실제로 업로드하지 않습니다.
   ═══════════════════════════════════════════════════════════ */
const WSKEY='ws:v1', LSKEY='reading-log-lab-v8';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>{const d=new Date();return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')};
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)return localStorage.removeItem(k);localStorage.setItem(k,v)}catch(e){return null}}
const TRACK={serial:'연재작',discovery:'투고작 · 발굴 후보'};
// 기록 방식은 같고, 검토 목적만 다르다
const PURPOSE={
  discovery:{q:'정식 연재로 발전시킬 매력이 있는가?',focus:'첫 화 후킹 · 캐릭터 · 장기 서사 가능성',next:'추가 원고 검토 · 작가 미팅 제안'},
  serial:{q:'작품의 매력을 어떻게 더 잘 전달할까?',focus:'회차별 반응 · 전개 · 독자 기대',next:'원고 피드백 · 패키징 개선 논의'}};
const STATUS=['검토 예정','검토 중','검토 완료','보류'];
// 작품 검토 기준: 관찰한 사실 -> 나의 해석 -> 검토 판단 -> 추가로 확인할 질문
const CRIT_NAMES=['소재 차별성과 타깃 독자','초반 후킹력과 다음 화를 읽게 하는 동기','캐릭터의 매력과 관계성','서사 전개와 연재 지속 가능성'];
const EMPTY_CRITERIA=()=>CRIT_NAMES.map(name=>({name,fact:'',interp:'',judge:'',ask:''}));
const EMPTY_REVIEW=()=>({charm:'',hook:'',intentMine:'',intentAuthor:'',intentSource:'',ask:'',strengths:'',gaps:'',nextQ:'',criteria:EMPTY_CRITERIA()});
const SEED_CRITERIA=()=>[
  {name:CRIT_NAMES[0],fact:'태그 3개가 모두 로맨스다 (#로맨스 #학원로맨스 #청춘로맨스). 공감이 가장 많은 댓글 2개는 정체를 추리하는 내용이다.',interp:"학원 로맨스에 '몸속에 누가 있나'라는 미스터리가 겹친 것이 이 작품만의 결합이다.",judge:'차별점은 있다. 다만 지금의 첫인상은 로맨스를 찾는 독자에게만 맞춰져 있다.',ask:'미스터리를 좋아하는 독자에게도 닿으려면 무엇을 먼저 보여 줘야 할까?'},
  {name:CRIT_NAMES[1],fact:"1~4화에 질문 3개, 7화와 8화에 정체에 관한 질문이 열렸다. 1~12화 내내 '다음 화 볼 이유'가 있었다 (내 리딩 로그).",interp:'질문을 빠르게 여는 설계가 다음 화를 누르게 만든다.',judge:'초반 후킹은 강점이다. 1인 기록이라 다른 독자 반응으로 더 확인해야 한다.',ask:'1~3화만 읽은 독자도 같은 질문을 품을까?'},
  {name:CRIT_NAMES[2],fact:'공식 소개글의 축은 조미, 짝사랑 상대 도윤, 돈으로 움직이는 수지다. 공감이 많은 댓글은 인물 관계보다 정체 추리에 모였다.',interp:"수지와 조미의 '내 몸 찾기' 관계가 미스터리를 끌고 가는 축일 수 있다 (가설).",judge:'관계성의 매력은 아직 판단할 근거가 부족하다. 회차별로 더 기록할 부분이다.',ask:'도윤의 비밀은 언제, 어떤 방식으로 드러날 계획일까?'},
  {name:CRIT_NAMES[3],fact:'8화에 열린 핵심 질문이 20화까지 열려 있다 (내 리딩 로그). 질문이 쌓인 12화에는 혼란스럽다는 댓글이, 답이 나온 15화에는 가장 많은 댓글이 달렸다.',interp:'작은 답이 늦어지면 흔들리고, 답이 오면 반응이 돌아온다.',judge:'긴 연재를 끌고 갈 질문은 충분하다. 답을 주는 호흡이 보완할 지점이다.',ask:'핵심 비밀을 지키면서 먼저 풀어도 되는 작은 답은 무엇일까?'}];

/* ── 기본 데이터: 『유체를 이탈하였습니다』 (2026.11.6 수집 값 그대로 · 감상 칸은 비워 둠) ── */
function seed(){
  const rating=[9.25,9.50,9.61,9.72,9.58,9.44,9.44,9.60,9.45,8.75,9.63,8.88,8.97,8.36,9.33,9.46,8.77,9.25,7.88,8.19];
  const likes={11:58,12:54,13:53,14:46,15:54,16:48,17:45,18:39,19:33,20:29};
  const comments={11:21,12:20,13:23,14:21,15:28,16:14,17:12,18:21,19:17,20:14};
  const immerse=[5,5,5,5,4,4,5,5,5,5,4,5,4,4,5,4,4,4,4,4];
  const q={1:'잠옷 차림, 학교 밖, 유체가 보이는 이유',7:'몸에 다른 사람이 들어왔나?',8:'몸속의 사람은 누구인가?',11:'반장의 과거',12:'조미와 몸의 기억이 다른 이유',16:'다른 유체이탈자, 귀신, 5일 경과'};
  const memo={15:'7화 질문에 답이 나옴',19:'공개 별점은 11.14 화면에서 7.78',20:'공개 별점은 11.14 화면에서 8.29'};

function tChart(w){

    const h=110,Y=x=>y+6+(hi-x)/(hi-lo)*(h-12);o+=lab(t,s);[lo,hi].forEach(g=>o+=`<line x1="${L}" x2="${Wd-10}" y1="${Y(g)}" y2="${Y(g)}" stroke="#EEF0F3"/><text x="${L-8}" y="${Y(g)+4}" font-size="11" fill="#98A1AE" text-anchor="end">${g}</text>`);

  try{const r=await fetch('/api/notes',{cache:'no-store'});if(r.ok){API_OK=true;const s=(await r.json()).notes?.[WSKEY];if(s){try{PUBLISHED=JSON.parse(s)}catch(e){}}}}catch(e){}
  ROOT=PUBLISHED?JSON.parse(JSON.stringify(PUBLISHED)):{};
  let local=null;try{local=JSON.parse(store(LSKEY)||'null')}catch(e){}
  if(ADMIN&&API_OK){LAB=normalize(ROOT.lab);SRC='server'}
  else if(local&&Array.isArray(local.works)){LAB=normalize(local);SRC='local'}
  else{LAB=normalize(ROOT.lab);SRC=ROOT.lab?'published':'seed'}
  readHash();
  if(!VIEW.work&&location.hash&&location.hash!=='#/')history.replaceState(null,'',location.pathname+location.search+'#/');
  render();const t=VIEW.ep&&document.getElementById('ep-'+VIEW.ep);if(t)t.scrollIntoView({block:'nearest'});logVisit()})();
</script>
